name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      # authtrace hooks httpx/httpx2 inside the traced program; these tests skip without them.
      - if: matrix.python == '3.13'
        run: |
          python -m pip install --quiet httpx httpx2
          python -m unittest tests.test_authtrace_capture -v
